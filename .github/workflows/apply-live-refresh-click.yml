name: Apply live refresh after user actions

on:
  push:
    paths:
      - '.github/live-refresh-click-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch live refresh listeners
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- BCL LIVE ACTION REFRESH -->'
          if marker not in s:
              patch='''\n<!-- BCL LIVE ACTION REFRESH -->\n<script>\n(function(){\n  let t=0;\n  function schedule(){\n    clearTimeout(t);\n    t=setTimeout(function(){\n      try{\n        if(typeof window.bclRefreshUIV111==='function'){\n          window.bclRefreshUIV111();\n          return;\n        }\n      }catch(e){}\n      try{if(typeof syncActiveContextV105==='function')syncActiveContextV105(true);}catch(e){}\n      try{if(typeof syncSettingsClassContext==='function')syncSettingsClassContext();}catch(e){}\n      ['renderClassStats','renderSkillsPage','renderComboPage','renderPlayerCombosPage','renderTransitionPage','renderAddonPage','renderComboBuilder','renderYouTubeAnalyzer'].forEach(function(name){\n        try{const fn=window[name];if(typeof fn==='function')fn();}catch(e){}\n      });\n      try{if(typeof renderAuthUI==='function')renderAuthUI();else if(typeof updateAuthUI==='function')updateAuthUI();}catch(e){}\n    },120);\n  }\n  document.addEventListener('click',function(e){\n    if(e.target.closest('button,a,[role="button"],.tab-btn'))schedule();\n  },true);\n  document.addEventListener('change',schedule,true);\n  document.addEventListener('input',function(e){\n    if(e.target.matches('select,input[type="checkbox"],input[type="radio"],input[type="number"]'))schedule();\n  },true);\n  window.bclScheduleLiveRefresh=schedule;\n})();\n</script>\n'''
              s=s.replace('</body>',patch+'\n</body>')
              p.write_text(s,encoding='utf-8')
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\\b(?![^>]*\\bsrc=)[^>]*>(.*?)</script>',text,re.I|re.S)
          for i,src in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'bcl_click_refresh_{i}.js'
              f.write_text(src,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  sys.exit(1)
          print('inline scripts valid')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh UI immediately after clicks and changes' || exit 0
          git push origin main
