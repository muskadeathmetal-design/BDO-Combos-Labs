name: Generate V116 static translations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/generate-static-auto-translations-v116.py'
      - '.github/workflows/generate-v116-auto-translations.yml'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install translator
        run: python -m pip install --disable-pip-version-check 'deep-translator==1.11.4'

      - name: Generate static translation cache
        run: python tools/generate-static-auto-translations-v116.py

      - name: Validate cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('bcl-static-auto-translations-v116.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          for lang in ('en','de','es','it','pt'):
              assert isinstance(data.get(lang), dict)
              print(lang, len(data[lang]))
          PY

      - name: Commit translation cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bcl-static-auto-translations-v116.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Complete V116 static translation cache"
          git push
