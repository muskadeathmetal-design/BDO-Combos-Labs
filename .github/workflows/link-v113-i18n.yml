name: Link V113 i18n engine

on:
  push:
    paths:
      - '.github/v113-link-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>BDO Combos Labs · V112</title>','<title>BDO Combos Labs · V113</title>',1)
          s=s.replace('<span class="app-header-version">V112</span>','<span class="app-header-version">V113</span>',1)
          tag='<script src="bcl-full-ui-i18n-v113.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validate JavaScript
        run: |
          node --check bcl-full-ui-i18n-v113.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>',text,re.I|re.S)
          for i,src in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'bcl_v113_inline_{i}.js'
              f.write_text(src,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  sys.exit(1)
          print('validation ok')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Enable full UI translation engine (V113)'
          git push origin main
