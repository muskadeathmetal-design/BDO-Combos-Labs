name: Fix V111 visible version

on:
  push:
    paths:
      - '.github/v111-version-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix visible version labels
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            '<span class="app-header-version">V110</span>':'<span class="app-header-version">V111</span>',
            "const BCL_WEB_VERSION_V109='V110';":"const BCL_WEB_VERSION_V109='V111';",
            'BDO Combos Labs V110: mode fichier local.':'BDO Combos Labs V111: mode fichier local.'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix visible V111 version labels'
          git push origin main
