name: Install V114 exhaustive i18n
on:
  push:
    paths:
      - 'bcl-i18n-v114.js'
      - '.github/workflows/install-v114-i18n.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate overlay
        run: node --check bcl-i18n-v114.js
      - name: Install overlay and bump version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="bcl-i18n-v114.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          s=s.replace('BDO Combos Labs · V113','BDO Combos Labs · V114')
          s=s.replace('>V113<','>V114<')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'bcl-i18n-v114.js' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Install V114 exhaustive UI translation overlay'
          git push