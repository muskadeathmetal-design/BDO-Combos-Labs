name: Install V116 static locales
on:
  push:
    branches: [main]
    paths:
      - 'tools/build-static-locales-v116.js'
      - 'tools/run-safe-static-build-v116.js'
      - 'tools/prepare-static-translation-patches-v116.js'
      - 'tools/apply-post-visible-translations-v116.js'
      - 'tools/apply-aligned-residual-translations-v116.js'
      - 'tools/apply-final-visible-residuals-v116.js'
      - 'tools/remove-public-v1-engines.js'
      - 'bcl-static-auto-translations-v116.json'
      - 'translations/**.json'
      - '.github/workflows/install-v116-static-locales.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-static-locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: node tools/prepare-static-translation-patches-v116.js
      - run: node tools/run-safe-static-build-v116.js
      - run: node tools/apply-post-visible-translations-v116.js
      - run: node tools/apply-aligned-residual-translations-v116.js
      - run: node tools/apply-final-visible-residuals-v116.js
      - name: Remove public V1 analysis engines
        run: node tools/remove-public-v1-engines.js
      - name: Verify generated locale pages
        run: |
          set -e
          for lang in fr en de es it pt; do
            test -f "$lang/index.html"
            ! grep -q 'bcl-i18n-v114.js' "$lang/index.html"
            ! grep -q 'bcl-i18n-v115-master.js' "$lang/index.html"
            ! grep -q 'bcl-full-ui-i18n-v113.js' "$lang/index.html"
            grep -q 'bcl-static-locale-router' "$lang/index.html"
            for file in bcl-timeline-engine-v1 bcl-timeline-adapter-v1 bcl-timeline-shadow-v1 bcl-combat-graph-v1 bcl-combat-graph-adapter-v1 bcl-confidence-engine-v1 bcl-protection-measurement-v1 bcl-protection-adapter-v1 bcl-multi-objective-engine-v1 bcl-multi-objective-adapter-v1 bcl-analysis-shadow-v1 bcl-shadow-comparator-v1; do ! grep -q "/$file.js" "$lang/index.html"; done
          done
          ! grep -q 'transición:' es/index.html
          ! grep -q 'fuente:transition' es/index.html
      - name: Commit generated static locales
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fr/index.html en/index.html de/index.html es/index.html it/index.html pt/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove public V1 analysis engines from generated site"
          git pull --rebase origin main
          git push
