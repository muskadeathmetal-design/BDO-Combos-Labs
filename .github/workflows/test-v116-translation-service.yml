name: Test V116 translation service
on:
  push:
    paths:
      - '.github/workflows/test-v116-translation-service.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check 'deep-translator==1.11.4'
      - run: |
          python - <<'PY'
          from deep_translator import GoogleTranslator
          print(GoogleTranslator(source='fr', target='en').translate('Mesurer automatiquement une vidéo'))
          PY
