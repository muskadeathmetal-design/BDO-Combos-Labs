name: Apply V113 full UI i18n

on:
  push:
    paths:
      - '.github/v113-full-i18n-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch full UI i18n
        shell: python
        run: |
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>BDO Combos Labs · V112</title>','<title>BDO Combos Labs · V113</title>',1)
          s=s.replace('<span class="app-header-version">V112</span>','<span class="app-header-version">V113</span>',1)
          marker='<script id="bcl-full-ui-i18n-v113">'
          if marker not in s:
              block=base64.b64decode('           ddLFsnZW5jb3JlJywneWV0J10sWydwb3VyJywnZm9yJ10sWydhdmVjJywnd2l0aCddLFsnc2FucycsJ3dpdGhvdXQnXSxbJ2V0JywnYW5kJ10sWydvdScsJ29yJ10sWydkZScsJ29mJ10sWydkZXMnLCdvZiddLFsnZHUnLCdvZiB0aGUnXSxbJ2xhJywndGhlJ10sWydsZScsJ3RoZSddLFsnbGVzJywndGhlJ11dLAogICAgZG ').decode('utf-8')
              s=s.replace('</body>',block+'\n</body>',1)
          p.write_text(s,encoding='utf-8')

      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>',text,re.I|re.S)
          for i,src in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'bcl_v113_{i}.js'
              f.write_text(src,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print('Script',i,'failed')
                  print(r.stderr)
                  sys.exit(1)
          print(len(scripts),'inline scripts valid')
          PY

      - name: Commit V113 full UI i18n
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Translate full UI while preserving skills inputs and CC (V113)'
          git push origin main
