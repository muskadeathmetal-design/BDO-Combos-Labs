              if marker not in s:
                  raise RuntimeError('fallbackWords marker not found')
              s=s.replace(marker,block+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate JavaScript
        run: node --check bcl-full-ui-i18n-v113.js
      - name: Commit coverage expansion
        run: |
          rm -f .github/workflows/expand-v113-i18n.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bcl-full-ui-i18n-v113.js .github/workflows/expand-v113-i18n.yml
          git commit -m 'Expand V113 UI translation coverage'
          git push origin main
