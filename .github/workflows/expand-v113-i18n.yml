    'Optimisation':'Optimization','Ressources':'Resources','Structure du combo':'Combo structure','Poids mobilité':'Mobility weight','Poids cancels / transitions':'Cancels / transitions weight','Coût ressource max.':'Max resource cost','Coût stamina max.':'Max stamina cost','Préserver la ressource':'Preserve resource',
    'Maximum de compétences':'Maximum skills','Seuil re-CC PvP':'PvP re-CC threshold','En dessous, le prochain skill doit appliquer un CC.':'Below this threshold, the next skill must apply a CC.',
    'Entrée / prise d’initiative':'Entry / initiative','Préparation du combo':'Combo setup','Contrôle / re-CC PvP':'Control / PvP re-CC','Dégâts principaux':'Main damage','Fin de chaîne / sortie':'End of chain / exit',
