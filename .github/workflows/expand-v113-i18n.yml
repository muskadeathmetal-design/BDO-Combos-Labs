    'Ouvrir Skills':'Open Skills','Ouvrir Combo Builder':'Open Combo Builder','Transitions / Cancels':'Transitions / Cancels',
    'Référentiel : aucun pour ce contexte':'Reference: none for this context','Skills chargés':'Loaded skills','Référentiel':'Reference','Combos':'Combos','Transitions':'Transitions','Complétude':'Completeness',
