name: Expand V113 i18n coverage

on:
  push:
    paths:
      - '.github/workflows/expand-v113-i18n.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Expand translations
        shell: python
        run: |
          from pathlib import Path
          p=Path('bcl-full-ui-i18n-v113.js')
          s=p.read_text(encoding='utf-8')
          marker='  const fallbackWords={'
          if 'V113_EXTRA_UI_TRANSLATIONS' not in s:
              block=r'''
