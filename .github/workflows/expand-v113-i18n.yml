    '0 compétence(s) de référence disponible(s) pour':'0 reference skill(s) available for','Clique pour ajouter les manquantes.':'Click to add missing ones.','Aucune compétence enregistrée pour':'No skill registered for','Ajouter une compétence manuellement':'Add a skill manually',
