name: Expand V113 i18n coverage

on:
  push:
    paths:
      - '.github/workflows/expand-v113-i18n.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Insert translation dictionary
        shell: python
        run: |
          from pathlib import Path
          p=Path('bcl-full-ui-i18n-v113.js')
          s=p.read_text(encoding='utf-8')
          marker='  const fallbackWords={'
          extra=Path('.github/v113-extra-translations.jsfrag').read_text(encoding='utf-8')
          if 'V113_EXTRA_UI_TRANSLATIONS' not in s:
              if marker not in s:
                  raise RuntimeError('fallbackWords marker not found')
              s=s.replace(marker,extra+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
      - name: Validate JavaScript
        run: node --check bcl-full-ui-i18n-v113.js
      - name: Commit coverage expansion
        run: |
          rm -f .github/workflows/expand-v113-i18n.yml .github/v113-extra-translations.jsfrag
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bcl-full-ui-i18n-v113.js .github/workflows/expand-v113-i18n.yml .github/v113-extra-translations.jsfrag
          git commit -m 'Expand V113 UI translation coverage'
          git push origin main
