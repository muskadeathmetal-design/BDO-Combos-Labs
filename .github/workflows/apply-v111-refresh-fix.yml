name: Apply V111 live refresh fix

on:
  push:
    paths:
      - '.github/v111-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index.html
        run: |
          echo '' | base64 -d > /tmp/v111.py
          python /tmp/v111.py
      - name: Commit V111
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix live UI refresh after Supabase sync (V111)"
          git push origin main
