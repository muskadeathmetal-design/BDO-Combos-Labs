name: Audit V116 untranslated UI
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/audit-static-en-v116.js'
      - 'tools/extract-missing-visible-locales-v116.js'
      - 'en/index.html'
      - 'de/index.html'
      - 'es/index.html'
      - 'it/index.html'
      - 'pt/index.html'
      - '.github/workflows/audit-v116-untranslated.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/audit-static-en-v116.js
      - run: node tools/extract-missing-visible-locales-v116.js
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/untranslated-visible-audit.txt de/untranslated-visible-audit.txt es/untranslated-visible-audit.txt it/untranslated-visible-audit.txt pt/untranslated-visible-audit.txt translations/missing-visible-v116.json
          git diff --cached --quiet || git commit -m "Audit V116 missing visible translations across locales"
          git pull --rebase origin main
          git push
